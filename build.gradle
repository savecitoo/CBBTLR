plugins {
    id 'java'
    id 'application'
}

group = 'basics'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

javadoc {
    options.memberLevel = JavadocMemberLevel.PRIVATE
}

application {
    mainClass = 'basics.App'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'org.jetbrains:annotations:24.1.0'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

// include i .ser nelle resources
sourceSets {
    main {
        resources {
            srcDirs = ["src/main/resources"]
        }
    }
}

task generateParser(type: JavaExec, dependsOn: compileJava) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cli.ParserGenerator'
    args = [
            project.findProperty("grammarFile") ?: "src/main/grammars/CoDiNEGrammar.cbg",
            project.findProperty("packageName") ?: "generated",
            project.findProperty("className")   ?: "CoDiNE",
            project.findProperty("outputDir")   ?: "src/main/java/generated"
    ]
}

task interpreter(type: JavaExec, dependsOn: classes) {
    description = 'Runs a CoDiNE program: ./gradlew interpreter -Pfile=tests/energy/sorgente.codine'
    group = 'application'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'interpreter.facade.Interpreter'
    standardInput = System.in

    doFirst {
        def file = project.findProperty('file')
        if (file == null)
            throw new GradleException("Missing source file: use -Pfile=<path/to/source.codine>")
        args = [file]
    }
}

test {
    useJUnitPlatform()
    doFirst {
        def generated = file("${projectDir}/src/main/java/generated")
        if (!generated.exists() || generated.listFiles().length == 0)
            logger.warn("WARNING: Generated files not found in src/main/java/generated. " +
                    "Run ./gradlew generateParser if needed.")
    }
}